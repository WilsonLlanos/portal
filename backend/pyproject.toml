[project]
name = "portal-backend"
version = "0.1.0"
description = "Backend do chat de IA (RAG) do portal de portfólio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=0.3",
    "groq>=0.13",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "upstash-redis>=1.2",
    "langfuse>=2.53",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
