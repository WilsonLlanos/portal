name: Base de conhecimento em dia

# T070: quando o conteúdo do autor muda, verifica se backend/data/kb/ (gerado
# por scripts/ingest.py) foi regenerado e commitado junto. Compara apenas o
# hash do conteúdo com o manifest (`--check`): não chama a API do Gemini, então
# não tem custo nem precisa de segredo.
# Sem `paths:` de propósito: este check é obrigatório na proteção da main e
# precisa rodar em todo PR. Sem mudança de conteúdo, o --check passa direto.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ingest-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-kb-freshness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - run: uv python install 3.12
      - run: uv sync

      - name: Conferir se backend/data/kb corresponde ao conteúdo
        run: uv run python scripts/ingest.py --check
