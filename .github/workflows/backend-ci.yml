name: Backend CI

# T069
# Sem `paths:` de propósito: este check é obrigatório na proteção da main e
# precisa rodar em todo PR, senão o merge fica esperando um check que nunca vem.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - run: uv python install 3.12
      - run: uv sync --all-extras --dev

      - run: uv run ruff check .
      - name: Testes (sem eval — dependem de credenciais reais)
        run: uv run pytest --ignore=tests/eval
